<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>浏览器交互验收</title>
<style>body{font:16px system-ui;margin:40px;background:#f5f7fa;color:#253348}main{max-width:700px;background:white;padding:32px;border-radius:16px}input,button{font:inherit;padding:10px;margin:8px 0}canvas{border:1px solid #aab7c6;display:block;touch-action:none}#long{height:1100px;background:linear-gradient(#eff4fa,#cddaf0);margin-top:24px}label{display:block}</style>
<main><h1>浏览器交互验收</h1><p>这是本地测试页，无需外部账号。</p><form id="form"><label>姓名 <input id="name" aria-label="姓名"></label><button id="submit">提交</button></form><p id="result">等待输入</p><button id="count">点击计数：0</button><button id="popup" onclick="window.open('/child','_blank')">打开新标签</button><canvas id="canvas" width="420" height="100"></canvas><p id="drag">尚未拖拽</p><div id="long">向下滚动测试</div></main>
<script>let count=0;document.querySelector('#form').onsubmit=e=>{e.preventDefault();document.querySelector('#result').textContent='已提交：'+document.querySelector('#name').value};document.querySelector('#count').onclick=e=>e.target.textContent='点击计数：'+(++count);let drawing=false;const c=document.querySelector('canvas'),g=c.getContext('2d');c.onpointerdown=e=>{drawing=true;g.beginPath();g.moveTo(e.offsetX,e.offsetY)};c.onpointermove=e=>{if(drawing){g.lineTo(e.offsetX,e.offsetY);g.stroke();document.querySelector('#drag').textContent='拖拽成功'}};c.onpointerup=()=>drawing=false;</script></html>
